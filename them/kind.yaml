# The them cluster: kind create cluster --name them --config them/kind.yaml
# Its data lives in data/them in the directory you run that from, mounted into the node at /data.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraMounts:
  - hostPath: data/them
    containerPath: /data
