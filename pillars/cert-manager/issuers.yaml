# The Unum's own authority: a self-signed root named for the Unum (__NAME__ is its name), and the ClusterIssuer named unum
# that signs with it. Everything the Unum issues comes from unum, so everything chains to this root.
# Then the Unum's own client certificate, named for the Unum, which is how it proves who it is to another Unum. Its unit is client:
# a subject the same as its issuer's (the root is named for the Unum too) makes OpenSSL take it for self-signed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: __NAME__
  secretName: root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: unum
spec:
  ca:
    secretName: root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client
  namespace: cert-manager
spec:
  commonName: __NAME__
  subject:
    organizationalUnits:
    - client
  secretName: client
  usages:
  - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: unum
