# The Unum's own authority: a self-signed root named for the Unum (__NAME__ is its name), and the ClusterIssuer named unum
# that signs with it. Everything the Unum issues comes from unum, so everything chains to this root.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: __NAME__
  secretName: root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: unum
spec:
  ca:
    secretName: root-ca
