# cert-manager, from its release at a version, so a Unum can issue certificates. It's applied server side by
# scripts/cert-manager.sh, since its CRDs are too big for a client side apply, and the Unum's own root and issuer (issuers.yaml)
# go in after it's running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
