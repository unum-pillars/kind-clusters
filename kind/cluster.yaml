# One cluster. __DATA__ is ~/.kind-data/<name>, mounted at /data; make cluster fills it in. Only applied when the cluster is made.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraMounts:
  - hostPath: __DATA__
    containerPath: /data
