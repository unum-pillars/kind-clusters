# The us cluster: kind create cluster --name us --config us/kind.yaml
# Its data lives in data/us in the directory you run that from, mounted into the node at /data. Its GUIs are on
# localhost:5465, see the port table in the README.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraPortMappings:
  - containerPort: 30466
    hostPort: 5465
    listenAddress: 127.0.0.1
  extraMounts:
  - hostPath: data/us
    containerPath: /data
