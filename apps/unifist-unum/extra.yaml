# What unifist-unum has that not every app does: a NodePort for browsers. The app's own Services stay ClusterIP, and
# other Unums reach it by name through the ingress, so no port is kept for them. The ports every app uses are in the
# README, so no two clash.
# How a browser reaches the GUI: the cluster's kind.yaml maps this port to a port on the host, localhost:5465 for us.
apiVersion: v1
kind: Service
metadata:
  name: gui-node
  namespace: unifist-unum
spec:
  type: NodePort
  selector:
    app: gui
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30466
