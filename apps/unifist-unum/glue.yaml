# What unifist-unum needs around it that its own YAML doesn't carry: its namespace, the secret its API reads to find
# the cluster's MySQL (mysql.mysql, root/root). Local dev only, the password is public on purpose.
apiVersion: v1
kind: Namespace
metadata:
  name: unifist-unum
---
apiVersion: v1
kind: Secret
metadata:
  name: secret
  namespace: unifist-unum
stringData:
  mysql.json: '{"host": "mysql.mysql", "user": "root", "password": "root"}'
---
# How another Unum reaches this API: <cluster>-control-plane:30465, from inside its cluster. The app's own Service stays
# ClusterIP. The ports every app uses are in the README, so no two clash.
apiVersion: v1
kind: Service
metadata:
  name: api-node
  namespace: unifist-unum
spec:
  type: NodePort
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30465
