# What unifist-unum needs around it that its own YAML doesn't carry: its namespace, and the secret its API reads to find
# the cluster's MySQL (mysql.mysql, root/root). Local dev only, the password is public on purpose.
apiVersion: v1
kind: Namespace
metadata:
  name: unifist-unum
---
apiVersion: v1
kind: Secret
metadata:
  name: secret
  namespace: unifist-unum
stringData:
  mysql.json: '{"host": "mysql.mysql", "user": "root", "password": "root"}'
